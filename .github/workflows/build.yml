name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ~/.platformio holds the platform, toolchain and Arduino core (~1.5 GB);
      # .pio/libdeps holds the libraries. Build output is never cached, so every
      # run is a clean build and warnings can't hide in stale objects.
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO Core
        run: pip install platformio==6.2.0

      - name: Build
        run: |
          set -o pipefail
          pio run 2>&1 | tee build.log

      - name: Fail on warnings in our code
        run: |
          if grep -E '^(src|include)/[^:]+:[0-9]+:[0-9]+: warning:' build.log; then
            echo "::error::Compiler warnings in src/ or include/ (see above)"
            exit 1
          fi

      - name: Collect binaries
        run: |
          mkdir dist
          cp .pio/build/ng-scout/firmware.bin dist/
          cp .pio/build/ng-scout/firmware.factory.bin dist/
          cat > dist/FLASHING.txt <<'EOF'
          firmware.factory.bin  Full image (bootloader + partitions + app). Flash at 0x0.
                                Use this for a first flash or to recover a board.
          firmware.bin          App only. Flash at 0x10000 to update an already-flashed board.

          esptool:  esptool --chip esp32c5 write-flash 0x0 firmware.factory.bin
          Browser:  https://espressif.github.io/esptool-js/  (Chrome/Edge), add the file at 0x0.
          EOF
          (cd dist && sha256sum *.bin > SHA256SUMS.txt)
          sed -n '/Memory Type Usage/,/Total image size/p' build.log > dist/memory-usage.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ng-scout-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  host:
    # Pure-C++ parts (802.15.4 parser, goblin beacon codec, the whole UI) build and run on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I src test/test_ieee802154.cpp -o t154 && ./t154
          g++ -std=c++17 -Wall -Wextra -Werror -I src test/test_peer.cpp -o tpeer && ./tpeer
          g++ -std=c++17 -Wall -Wextra -Werror -I tools/preview/shim -I src test/test_quests.cpp src/core/Quests.cpp src/core/Hats.cpp -o tq && ./tq
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I src test/test_trackers.cpp src/core/Trackers.cpp -o ttrk && ./ttrk

      # The same UI code with AddressSanitizer: a buffer overflow that the PC shrugs off can
      # reset the board (v0.3.1 boot loop), so any memory error here fails the build.
      - name: UI preview under the memory checker
        run: |
          pip install pillow
          PREVIEW_FLAGS="-g -fsanitize=address,undefined -fno-sanitize=shift -fno-sanitize-recover=all" sh tools/preview/run.sh

      - name: Render UI preview
        run: |
          pip install pillow
          sh tools/preview/run.sh 2>&1 | tee preview.log
          if grep -q "warning:" preview.log; then echo "::error::warnings in UI code"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: ui-preview-${{ github.sha }}
          path: tools/preview/out/*.png
          if-no-files-found: error
