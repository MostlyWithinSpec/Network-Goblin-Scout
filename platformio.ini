; Network Goblin Scout — firmware for NM-CYD-C5 (ESP32-C5-WROOM-1-N16R8)
;
; ESP32-C5 needs Arduino core 3.3.x, which the stock PlatformIO espressif32
; platform does not ship yet. We use the community "pioarduino" platform,
; pinned to a release (55.03.312 = Arduino core 3.3.12 / ESP-IDF 5.5) so builds
; don't change underneath us. Bump deliberately.

[platformio]
default_envs = ng-scout

[env:ng-scout]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
; NM-CYD-C5 carries an ESP32-C5-WROOM-1-N16R8 (16 MB quad flash, 8 MB quad PSRAM).
; The closest stock board is the N16R4 DevKitC: same flash, PSRAM enabled.
; PSRAM size is detected at boot, so the 8 MB on our module is used in full.
board = esp32-c5-devkitc1-n16r4
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    ; Serial goes to the ESP32-C5 native USB-C port.
    ; Set both to 0 if you want logs on the CH340 USB-C port instead.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Framework/library logging at 2 = warnings only. (At info level the BLE
    ; library prints the raw MAC of every advertiser, which we don't want.)
    -DCORE_DEBUG_LEVEL=2
; Warnings for our own code only (framework/libraries keep their defaults).
build_src_flags =
    -Wall
    -Wextra
    ; Our own code logs at 3 = info (see include/ng_log_level.h).
    -include ng_log_level.h

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.6.0
    bblanchon/ArduinoJson @ ^7.2.0
    mikalhart/TinyGPSPlus @ ^1.1.0
