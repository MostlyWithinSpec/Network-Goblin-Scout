; Network Goblin Scout — firmware for NM-CYD-C5 (ESP32-C5-WROOM-1-N16R8)
;
; ESP32-C5 needs Arduino core 3.3.x, which the stock PlatformIO espressif32
; platform does not ship yet. We use the community "pioarduino" platform.

[platformio]
default_envs = ng-scout

[env:ng-scout]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-c5-devkitc-1

; NM-CYD-C5 carries a 16 MB flash / 8 MB PSRAM module
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    ; Serial goes to the ESP32-C5 native USB-C port.
    ; Set both to 0 if you want logs on the CH340 USB-C port instead.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
build_unflags =
    -std=gnu++11

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.6.0
    bblanchon/ArduinoJson @ ^7.2.0
    mikalhart/TinyGPSPlus @ ^1.1.0
